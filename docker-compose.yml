services:
  gateway:
    build: .
    image: chatwoot-vk-gateway
    container_name: chatwoot-vk-gateway
    restart: unless-stopped
    env_file: .env
    ports:
      - '${PORT:-3000}:3000'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
    # Uncomment to enable the Redis-backed dedup cache (set REDIS_URL=redis://redis:6379 in .env):
    # depends_on:
    #   - redis

