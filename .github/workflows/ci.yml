name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
          cache: 'npm'
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t chatwoot-vk-gateway .
      - name: Verify graceful shutdown in the built image
        run: |
          docker run --rm -i --network none --memory 128m --memory-swap 128m --cpus 0.5 \
            --entrypoint node chatwoot-vk-gateway --input-type=module \
            < docs/releases/2026-10-22-shutdown/verify-shutdown.mjs
